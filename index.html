<button id="likeButton">
  ❤️ Curtir (<span id="likeCount">0</span>)
</button>

<script>
  let curtido = false;
  let curtidas = 0;

  const botao = document.getElementById("likeButton");
  const contador = document.getElementById("likeCount");

  botao.addEventListener("click", () => {
    if (!curtido) {
      curtidas++;
      curtido = true;
      botao.style.color = "red";
    } else {
      curtidas--;
      curtido = false;
      botao.style.color = "";
    }

    contador.textContent = curtidas;
  });
</script>
